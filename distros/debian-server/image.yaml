image:
  name: ps5-debian-server
  distribution: debian
  release: bookworm
  description: Debian 12 server (headless, SSH) for PS5
  architecture: x86_64

source:
  downloader: debootstrap
  url: http://deb.debian.org/debian
  variant: minbase
  keyserver: keyserver.ubuntu.com

packages:
  manager: apt
  update: true
  cleanup: true

  repositories:
  - name: sources.list
    url: |-
      deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
      deb http://deb.debian.org/debian bookworm-updates main contrib non-free non-free-firmware
      deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
    architectures:
    - amd64

  sets:
  - packages:
    # Networking: NetworkManager so Wi-Fi works headless (nmcli / nmtui)
    - network-manager
    - openssh-server
    - iputils-ping
    - iw
    - wpasupplicant
    - wireless-regdb
    - rfkill
    - ethtool
    - chrony

    # Bluetooth
    - bluetooth
    - bluez
    - bluez-tools

    # GPU compute userspace (Vulkan / VA-API)
    - mesa-vulkan-drivers
    - mesa-va-drivers
    - vulkan-tools

    # Firmware + PS5 boot support
    - firmware-linux
    - firmware-linux-nonfree
    - firmware-amd-graphics
    - firmware-realtek
    - firmware-atheros
    - firmware-misc-nonfree
    - initramfs-tools
    - kexec-tools
    - kmod
    - busybox
    - zstd
    - systemd-zram-generator

    # Base utilities
    - sudo
    - cloud-guest-utils
    - parted
    - e2fsprogs
    - usbutils
    - pciutils
    - util-linux
    - curl
    - wget
    - git
    - ca-certificates
    - vim
    - nano
    - tmux
    - htop
    - less
    - bash-completion
    - build-essential
    action: install

files:
- path: /etc/hostname
  generator: hostname

- path: /etc/hosts
  generator: hosts

- path: /etc/machine-id
  generator: dump

- path: /etc/kernel/postinst.d/zz-update-boot
  generator: copy
  source: /tmp/build-staging/zz-update-boot
  mode: "0755"

- path: /etc/fstab
  generator: copy
  source: /tmp/build-staging/fstab

- path: /usr/local/sbin/grow-rootfs
  generator: copy
  source: /tmp/build-staging/grow-rootfs
  mode: "0755"

- path: /etc/systemd/system/grow-rootfs.service
  generator: copy
  source: /tmp/build-staging/grow-rootfs.service

- path: /usr/local/sbin/ps5-ssh-keys
  generator: copy
  source: /tmp/build-staging/ps5-ssh-keys
  mode: "0755"

- path: /etc/systemd/system/ps5-ssh-keys.service
  generator: copy
  source: /tmp/build-staging/ps5-ssh-keys.service

- path: /etc/systemd/system/ps5-ssh-hostkeys.service
  generator: copy
  source: /tmp/build-staging/ps5-ssh-hostkeys.service

- path: /opt/debs/
  generator: copy
  source: /tmp/build-staging/debs

actions:
- trigger: post-unpack
  action: |-
    #!/bin/bash
    set -eux
    echo 'Acquire::Retries "10";' > /etc/apt/apt.conf.d/80retry
    apt-get update

- trigger: post-update
  action: |-
    #!/bin/bash
    set -eux
    passwd -l root

- trigger: post-packages
  action: |-
    #!/bin/bash
    set -eux
    export DEBIAN_FRONTEND=noninteractive

    # Default user ps5/ps5, password change forced at first login.
    useradd -m -G sudo,video,render,input -s /bin/bash ps5
    echo "ps5:ps5" | chpasswd
    chage -d 0 ps5

    printf 'ps5\n' > /etc/hostname
    if grep -q '^127\.0\.1\.1' /etc/hosts; then
      sed -i 's/^127\.0\.1\.1.*/127.0.1.1 ps5/' /etc/hosts
    else
      printf '127.0.1.1 ps5\n' >> /etc/hosts
    fi

    # SSH on. Keyboard-interactive allows the forced password change;
    # keys can go in authorized_keys on the boot partition.
    sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/'               /etc/ssh/sshd_config
    sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
    sed -i 's/^#*KbdInteractiveAuthentication.*/KbdInteractiveAuthentication yes/' /etc/ssh/sshd_config
    systemctl enable ssh.service

    # NetworkManager manages every interface (ifupdown has nothing configured).
    systemctl enable NetworkManager
    systemctl enable chrony || true
    systemctl enable bluetooth.service
    systemctl set-default multi-user.target

    ln -sf /usr/share/zoneinfo/Etc/UTC /etc/localtime
    printf 'Etc/UTC\n' > /etc/timezone

    # zram swap
    printf '[zram0]\nzram-size = ram / 2\ncompression-algorithm = zstd\n' > /etc/systemd/zram-generator.conf

- trigger: post-files
  action: |-
    #!/bin/bash
    set -eux
    systemctl enable grow-rootfs.service
    systemctl enable ps5-ssh-keys.service
    # No SSH host keys in the image: each console generates its own.
    rm -f /etc/ssh/ssh_host_*
    systemctl enable ps5-ssh-hostkeys.service
    mkdir -p /boot/efi

    mkdir -p /etc/initramfs-tools/conf.d
    printf 'RESUME=none\n' > /etc/initramfs-tools/conf.d/resume

    # Install the PS5-patched kernel
    dpkg -i /opt/debs/*.deb
    rm -rf /opt/debs
    apt-mark hold linux-ps5 || true

    KVER=$(ls -1t /lib/modules | head -1)
    depmod -a "$KVER"

    # Front-load amdgpu for the PS5 console
    grep -qxF amdgpu /etc/initramfs-tools/modules || printf '\namdgpu\n' >> /etc/initramfs-tools/modules
    printf 'MODULES=most\nBUSYBOX=y\n' > /etc/initramfs-tools/conf.d/ps5-amdgpu
    update-initramfs -c -k "$KVER"
    /etc/kernel/postinst.d/zz-update-boot "$KVER"

mappings:
  architecture_map: debian
