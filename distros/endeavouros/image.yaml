image:
  name: ps5-endeavouros
  distribution: archlinux
  description: EndeavourOS (Arch + EndeavourOS repo) with KDE Plasma for PS5
  architecture: x86_64

source:
  downloader: archlinux-http
  url: https://geo.mirror.pkgbuild.com/iso
  skip_verification: true

packages:
  manager: pacman
  update: true
  cleanup: true

  repositories:
  - name: mirrorlist
    url: |-
      Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

  sets:
  - packages:
    # EndeavourOS
    - endeavouros-keyring
    - endeavouros-mirrorlist
    - endeavouros-branding
    - eos-hooks
    - eos-bash-shared
    - eos-update
    - eos-rankmirrors
    - eos-settings-plasma
    - welcome
    - yay

    # KDE Plasma (Wayland) + SDDM
    - plasma-meta
    - sddm
    - konsole
    - dolphin
    - kate
    - ark
    - spectacle
    - gwenview
    - okular
    - xorg-xwayland

    # Bluetooth
    - bluez
    - bluez-utils

    # Audio / media
    - pipewire
    - wireplumber
    - pipewire-pulse

    # Display / GPU (AMD)
    - mesa
    - vulkan-radeon
    - libva-mesa-driver
    - libinput

    # Apps
    - firefox

    # Networking
    - networkmanager
    - linux-firmware
    - wireless-regdb

    # System
    - base
    - openssh
    - sudo
    - nano
    - bash
    - mkinitcpio
    - kmod
    - e2fsprogs
    - parted
    - polkit
    - dbus
    - kexec-tools
    - zram-generator

    # Fonts
    - ttf-dejavu
    - ttf-liberation
    - noto-fonts
    - fontconfig
    action: install

files:
- path: /etc/hostname
  generator: hostname

- path: /etc/hosts
  generator: hosts

- path: /etc/kernel/postinst.d/zz-update-boot
  generator: copy
  source: /tmp/build-staging/zz-update-boot
  mode: "0755"

- path: /etc/fstab
  generator: copy
  source: /tmp/build-staging/fstab

- path: /usr/local/sbin/grow-rootfs
  generator: copy
  source: /tmp/build-staging/grow-rootfs
  mode: "0755"

- path: /etc/systemd/system/grow-rootfs.service
  generator: copy
  source: /tmp/build-staging/grow-rootfs.service

- path: /etc/xdg/plasma-workspace/env/ps5-drm-bridge.sh
  generator: copy
  source: /tmp/build-staging/plasma-workspace-env-ps5.sh
  mode: "0755"

- path: /opt/pkgs/
  generator: copy
  source: /tmp/build-staging/pkgs

actions:
- trigger: post-unpack
  action: |-
    #!/bin/bash
    set -eux
    # Pacman 7 Landlock sandbox is unsupported under QEMU; disable it.
    sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf

    pacman-key --init
    pacman-key --populate archlinux
    cat > /etc/pacman.d/mirrorlist <<'EOF'
    Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
    Server = https://mirrors.kernel.org/archlinux/$repo/os/$arch
    EOF
    pacman -Syy --noconfirm

    # --- EndeavourOS keyring ---------------------------------------------
    # Fetch endeavouros-keyring from the repo and accept it only if its
    # signature is from one of EndeavourOS's trusted keys (the list in
    # endeavouros-team/keyring, endeavouros-trusted).
    EOS_TRUSTED="8F43FC374CD4CEEA19CEE323E3D8752ACDF595A1
    286E73D3CB90A2368DE1B0B12B37DD3DB00531E8
    497AF50C92AD2384C56E1ACA003DB8B0CB23504F
    E0D16589967E1FE68EF8693E7EED78C58A63A62E
    0F20FADC599D1C46EB556455AED8858E4B9813F1
    C918B8CB65A96DFA48F1F2E6BC4423F58F260BAF
    8AD2DB862F3CA7B90B9CAF578B7B0A2203562CF6"
    EOS_MIRRORS="https://mirror.alpix.eu/endeavouros/repo
    https://ftp.belnet.be/mirror/endeavouros/repo"
    tmp=$(mktemp -d)
    for m in $EOS_MIRRORS; do
      curl -fsSL -o "$tmp/eos.db" "$m/endeavouros/x86_64/endeavouros.db" && { EOS=$m; break; }
    done
    name=$(bsdtar -tf "$tmp/eos.db" | sed -n 's#^\(endeavouros-keyring-[^/]*\)/$#\1#p' | head -1)
    pkg="$name-any.pkg.tar.zst"
    curl -fsSL -o "$tmp/$pkg"     "$EOS/endeavouros/x86_64/$pkg"
    curl -fsSL -o "$tmp/$pkg.sig" "$EOS/endeavouros/x86_64/$pkg.sig"
    mkdir -p "$tmp/k"
    bsdtar -xf "$tmp/$pkg" -C "$tmp/k" usr/share/pacman/keyrings
    export GNUPGHOME="$tmp/g"; mkdir -m 700 "$GNUPGHOME"
    gpg -q --import "$tmp/k/usr/share/pacman/keyrings/endeavouros.gpg"
    signer=$(gpg --status-fd 1 --verify "$tmp/$pkg.sig" "$tmp/$pkg" 2>/dev/null | awk '$2=="VALIDSIG"{print $NF}')
    echo "$EOS_TRUSTED" | tr -d ' ' | grep -qixF "$signer" || { echo "EndeavourOS keyring not signed by a trusted key: '$signer'"; exit 1; }
    unset GNUPGHOME
    # Trust the keys directly; endeavouros-keyring itself (installed with the
    # package set) then owns /usr/share/pacman/keyrings/endeavouros*.
    pacman-key --add "$tmp/k/usr/share/pacman/keyrings/endeavouros.gpg"
    for fpr in $EOS_TRUSTED; do pacman-key --lsign-key "$fpr"; done
    rm -rf "$tmp"

    # EndeavourOS repo (after core/extra, as on EndeavourOS). The mirror list
    # package replaces this bootstrap list in post-packages.
    printf '%s\n' "$EOS_MIRRORS" | sed 's#$#/$repo/$arch#; s#^ *#Server = #' > /etc/pacman.d/endeavouros-mirrorlist.bootstrap
    printf '\n[endeavouros]\nSigLevel = PackageRequired\nInclude = /etc/pacman.d/endeavouros-mirrorlist.bootstrap\n' >> /etc/pacman.conf
    pacman -Syy --noconfirm

- trigger: post-packages
  action: |-
    #!/bin/bash
    set -eux
    fc-cache -f 2>/dev/null || true

    # Switch to the mirror list shipped by endeavouros-mirrorlist.
    sed -i 's#/etc/pacman.d/endeavouros-mirrorlist.bootstrap#/etc/pacman.d/endeavouros-mirrorlist#' /etc/pacman.conf
    rm -f /etc/pacman.d/endeavouros-mirrorlist.bootstrap

    sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/'               /etc/ssh/sshd_config
    sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
    # SSH off by default (public default credentials)
    systemctl disable sshd.service 2>/dev/null || true
    systemctl enable NetworkManager.service
    systemctl enable bluetooth.service
    systemctl disable plasmalogin.service 2>/dev/null || true
    systemctl enable sddm.service
    systemctl set-default graphical.target

- trigger: post-files
  action: |-
    #!/bin/bash
    set -eux
    mkdir -p /etc/systemd/system/local-fs.target.wants
    ln -sf /etc/systemd/system/grow-rootfs.service \
      /etc/systemd/system/local-fs.target.wants/grow-rootfs.service

    # zram swap: half of RAM, zstd compressed
    printf '[zram0]\nzram-size = ram / 2\ncompression-algorithm = zstd\n' > /etc/systemd/zram-generator.conf

    # Default user (ps5/ps5) with SDDM autologin into Plasma (Wayland)
    useradd -m -G wheel,video,input,render -s /bin/bash ps5
    echo "ps5:ps5" | chpasswd
    echo "%wheel ALL=(ALL:ALL) NOPASSWD: ALL" > /etc/sudoers.d/wheel
    printf 'ps5\n' > /etc/hostname
    mkdir -p /etc/sddm.conf.d
    printf '[Autologin]\nUser=ps5\nSession=plasma\nRelogin=false\n' > /etc/sddm.conf.d/50-ps5-autologin.conf
    chown -R ps5:ps5 /home/ps5

    [ -f /etc/vconsole.conf ] || echo "KEYMAP=us" > /etc/vconsole.conf
    # Drop autodetect: it detects the build host, not the PS5.
    sed -i 's/ autodetect//' /etc/mkinitcpio.conf

    # Install the PS5 kernel package (provides/replaces linux)
    if ls /opt/pkgs/*.pkg.tar.zst 1>/dev/null 2>&1; then
        pacman -U --noconfirm --ask 4 /opt/pkgs/*.pkg.tar.zst
        rm -rf /opt/pkgs
        KVER=$(ls -1t /lib/modules | head -1)
        mkinitcpio -k "$KVER" -g "/boot/initrd.img-$KVER" || true
    fi

    mkdir -p /boot/efi
    /etc/kernel/postinst.d/zz-update-boot

mappings:
  architecture_map: archlinux
