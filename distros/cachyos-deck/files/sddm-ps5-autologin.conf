# Installed as zzz- so it overrides zz-steamos-autologin.conf; ps5-session
# picks game mode or Plasma.
[Autologin]
Relogin=true
Session=ps5-session.desktop
User=steam

# Wayland mode skips the unused X greeter (about 3 s and one HDMI mode change).
[General]
DisplayServer=wayland

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
