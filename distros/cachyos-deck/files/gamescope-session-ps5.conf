# PS5 settings for the gamescope-session-cachyos game mode session
# (drop-in for the systemd user unit gamescope-session.service).
#   LIBSEAT_BACKEND=logind     take the DRM and input devices through logind
#   WLR_LIBINPUT_NO_DEVICES=1  no input device is attached at boot; do not abort
#   OUTPUT_CONNECTOR=DP-1      the PS5's internal DP connector (HDMI bridge)
#   ps5-display-reset         undo the 8-bit limit the desktop leaves on the
#                             connector (see that script)
#   ps5-display-profile       offer HDR only where the kernel sends it (see
#                             that script)
[Service]
ExecStartPre=-/usr/local/lib/ps5-display-reset
ExecStartPre=-/usr/local/lib/ps5-display-profile
Environment=LIBSEAT_BACKEND=logind
Environment=WLR_LIBINPUT_NO_DEVICES=1
Environment=OUTPUT_CONNECTOR=DP-1
