name: Build Image
run-name: Build Image (${{ inputs.distro || 'all' }})

on:
  workflow_dispatch:
    inputs:
      distro:
        description: 'Distribution'
        default: 'ubuntu2604'
        type: choice
        # Keep in step with .github/images.json.
        options: [all, ubuntu2604, arch, cachyos, cachyos-deck, fedora, proxmox, debian, debian13, bazzite, bazzite-deck, steamos, ubuntu-server, kubuntu2604, fedora-kde, debian-server, nobara, endeavouros, linuxmint, popos]
  workflow_call:
    inputs:
      distro:
        type: string
        default: 'ubuntu2604'
    # Without the R2 secrets (a fork) the images go to the GitHub release instead.
    secrets:
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      R2_ENDPOINT:
        required: false
      R2_BUCKET:
        required: false

# A newer full build cancels the running one; single-distro and PR builds are left alone.
concurrency:
  group: >-
    ps5-images-${{ github.event_name == 'pull_request_target'
                   && format('pr-{0}', github.event.pull_request.number)
                   || (inputs.distro == 'all' && 'all' || github.run_id) }}
  cancel-in-progress: true

# Optional repository variables:
#   IMAGE_RUNNER, KERNEL_RUNNER  runner labels as JSON, default ["ubuntu-24.04"]
#   XZ_LEVEL                     xz preset, default 4
#   R2_PUBLIC_URL                public address of the R2 bucket

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      distros: ${{ steps.set.outputs.distros }}
      publish: ${{ steps.set.outputs.publish }}
      store: ${{ steps.set.outputs.store }}
    steps:
      - name: Checkout image list
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/images.json
          sparse-checkout-cone-mode: false

      - id: set
        env:
          INPUT: ${{ inputs.distro || 'ubuntu2604' }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$INPUT" = "all" ]; then
            distros=$(jq -c '[.[].key]' .github/images.json)
          else
            distros=$(jq -c --arg d "$INPUT" '[.[].key | select(. == $d)]' .github/images.json)
          fi
          if [ "$distros" = "[]" ]; then
            echo "::error::'$INPUT' is not in .github/images.json"
            exit 1
          fi
          echo "distros=$distros" >> "$GITHUB_OUTPUT"

          # Images go to R2 when its secrets are set, else to the GitHub
          # release (split into parts over 2 GiB). PRs only build.
          publish=true
          case "$EVENT" in pull_request*) publish=false ;; esac
          store=r2
          [ -n "$R2_BUCKET" ] || store=github
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "store=$store" >> "$GITHUB_OUTPUT"

  # The kernel is the same for every image: build and package it once.
  kernel:
    needs: matrix
    runs-on: ${{ fromJSON(vars.KERNEL_RUNNER || '["ubuntu-24.04"]') }}
    timeout-minutes: 180
    steps:
      - name: Clean kernel workspace
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_WORKSPACE:-}" ] || [ "$GITHUB_WORKSPACE" = "/" ]; then
            echo "Invalid GITHUB_WORKSPACE" >&2
            exit 1
          fi
          sudo rm -rf "$GITHUB_WORKSPACE/kernel"

      - name: Checkout image builder
        uses: actions/checkout@v6
        with:
          path: kernel

      # Keep ccache between runs.
      - name: Restore compiler cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: kernel/ccache
          key: kernel-ccache-${{ github.run_id }}
          restore-keys: kernel-ccache-

      - name: Build kernel packages
        env:
          DISTROS: ${{ needs.matrix.outputs.distros }}
        run: |
          set -euo pipefail
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            export CCACHE_DIR=/home/opc/ccache
          else
            mkdir -p kernel/ccache
            echo "max_size = 2G" > kernel/ccache/ccache.conf
          fi
          formats=$(for d in $(tr -d '[]"' <<< "$DISTROS" | tr ',' ' '); do
                      bash kernel/build_image.sh --distro "$d" --print-format
                    done | sort -u | paste -sd, -)
          echo "Kernel package formats: $formats"
          FORMAT="$formats" bash kernel/build_image.sh --kernel-only

      - name: Upload kernel packages
        uses: actions/upload-artifact@v6
        with:
          name: kernel-packages
          path: |
            kernel/linux-bin/*.deb
            kernel/linux-bin/*.rpm
            kernel/linux-bin/*.pkg.tar.zst
            kernel/linux-bin/VERSION
            kernel/linux-bin/PATCHES_SHA
          if-no-files-found: error
          retention-days: 1

      - name: Remove kernel workspace
        if: always() && runner.environment == 'self-hosted'
        run: sudo rm -rf "${GITHUB_WORKSPACE:?}/kernel"

  build:
    needs: [matrix, kernel]
    runs-on: ${{ fromJSON(vars.IMAGE_RUNNER || '["ubuntu-24.04"]') }}
    timeout-minutes: 350
    # Don't build the same distro in two runs at once.
    concurrency:
      group: ps5-image-${{ matrix.distro }}
      cancel-in-progress: false
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJson(needs.matrix.outputs.distros) }}

    steps:
      - name: Clean image workspace
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_WORKSPACE:-}" ] || [ "$GITHUB_WORKSPACE" = "/" ]; then
            echo "Invalid GITHUB_WORKSPACE" >&2
            exit 1
          fi
          # A previous run can leave loop mounts (kpartx / losetup -P) and
          # bind mounts (distrobuilder chroots) live inside image/work/.
          # rm -rf then trips on "Directory not empty" because it can't
          # cross the mountpoint. Unmount everything under the workspace
          # first, then detach any loop devices still backed by files in
          # the workspace, then rm.
          WS="$GITHUB_WORKSPACE"
          # Lazy-unmount any mount whose target is under the workspace.
          # Reverse order so deepest mounts go first.
          for m in $(findmnt -rn -o TARGET | grep "^$WS/" | sort -r || true); do
            echo "unmounting stale $m"
            sudo umount -l "$m" || true
          done
          # Detach any loop device whose backing file lives under the
          # workspace (or shows '(deleted)' against one — that means the
          # backing file was removed but the loop wasn't released).
          for l in $(sudo losetup -l --noheadings -O NAME,BACK-FILE 2>/dev/null \
                     | awk -v ws="$WS" '$2 ~ "^"ws || $2 ~ ws"/" || $2 ~ "\\(deleted\\)$" {print $1}'); do
            echo "detaching stale loop $l"
            sudo losetup -d "$l" || true
          done
          sudo rm -rf "$WS/image"

      - name: Checkout image builder
        uses: actions/checkout@v6
        with:
          path: image

      - name: Download kernel packages
        uses: actions/download-artifact@v6
        with:
          name: kernel-packages
          path: image/linux-bin

      - name: Build ${{ matrix.distro }} image
        run: |
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            export CCACHE_DIR=/home/opc/ccache
          fi
          ls -l image/linux-bin
          bash image/build_image.sh --distro "${{ matrix.distro }}"

      - name: Set version info
        id: version
        run: |
          psha=$(cat image/linux-bin/PATCHES_SHA 2>/dev/null \
                 || git -C image/work/ps5-linux-patches rev-parse --short HEAD 2>/dev/null \
                 || echo "unknown")
          kver=$(cat image/linux-bin/VERSION 2>/dev/null || echo "unknown")
          ts=$(date -u +%Y%m%d-%H%M%S)
          {
            echo "psha=$psha"
            echo "kver=$kver"
            echo "ts=$ts"
          } >> "$GITHUB_OUTPUT"

      - name: Report
        run: |
          ls -lh image/output/*.img

      - name: Compress image
        env:
          XZ_LEVEL: ${{ vars.XZ_LEVEL || '4' }}
        run: |
          case "$XZ_LEVEL" in [0-9]) ;; *) echo "XZ_LEVEL must be 0-9" >&2; exit 1 ;; esac
          xz -T0 "-$XZ_LEVEL" -c image/output/ps5-${{ matrix.distro }}.img \
            > image/output/ps5-${{ matrix.distro }}.img.xz
          # sha256sum -c file next to the image
          ( cd image/output && sha256sum ps5-${{ matrix.distro }}.img.xz \
              > ps5-${{ matrix.distro }}.img.xz.sha256 )
          ls -lh image/output/ps5-${{ matrix.distro }}.img.xz

      - name: Upload to R2
        if: needs.matrix.outputs.publish == 'true' && needs.matrix.outputs.store == 'r2'
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: true
        run: |
          if ! command -v rclone > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends rclone
          fi
          # Upload the checksum with the image, not later in the release job.
          rclone copyto image/output/ps5-${{ matrix.distro }}.img.xz \
            "r2:${{ secrets.R2_BUCKET }}/ps5-${{ matrix.distro }}.img.xz"
          rclone copyto image/output/ps5-${{ matrix.distro }}.img.xz.sha256 \
            "r2:${{ secrets.R2_BUCKET }}/ps5-${{ matrix.distro }}.img.xz.sha256"

      - name: Upload to GitHub release
        if: needs.matrix.outputs.publish == 'true' && needs.matrix.outputs.store == 'github'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IMG: ps5-${{ matrix.distro }}.img.xz
        run: |
          set -euo pipefail
          cd image/output
          # Release files are limited to 2 GiB.
          if [ "$(stat -c %s "$IMG")" -gt 2000000000 ]; then
            split -b 1900M --numeric-suffixes=1 -a 1 "$IMG" "$IMG.part"
            rm "$IMG"
          fi
          files=$(ls "$IMG" "$IMG".part* "$IMG.sha256" 2>/dev/null || true)
          # Every image job may be the first one; create the release once.
          if ! gh release view latest > /dev/null 2>&1; then
            gh release create latest --target "$GITHUB_SHA" --title "PS5 Linux Image (latest)" \
              --notes "Images are being uploaded." 2>/dev/null || gh release view latest > /dev/null
          fi
          # Drop this image's files from an earlier build (the part count can change).
          old=$(gh release view latest --json assets --jq '.assets[].name' |
                awk -v f="$IMG" '$0 == f || $0 == f ".sha256" ||
                                 ($0 ~ /\.part[0-9]+$/ && index($0, f ".part") == 1)')
          for a in $old; do gh release delete-asset latest "$a" -y; done
          for f in $files; do
            for try in 1 2 3; do
              gh release upload latest "$f" --clobber && break
              [ "$try" = 3 ] && exit 1
              sleep 30
            done
          done

      - name: Save build metadata
        run: |
          # meta/ persists on self-hosted runners; clear stale checksums.
          rm -rf meta
          mkdir -p meta
          cp image/output/ps5-${{ matrix.distro }}.img.xz.sha256 meta/${{ matrix.distro }}.sha256
          echo "${{ steps.version.outputs.kver }}" > meta/kver
          echo "${{ steps.version.outputs.psha }}" > meta/psha
          echo "${{ steps.version.outputs.ts }}" > meta/ts

      - name: Upload build metadata
        uses: actions/upload-artifact@v6
        with:
          name: meta-${{ matrix.distro }}
          path: meta/
          retention-days: 1

  release:
    needs: [matrix, build]
    runs-on: ubuntu-latest
    concurrency:
      group: ps5-image-release
      cancel-in-progress: false
    # Run even if some distros failed: their siblings are already uploaded.
    if: >-
      ${{ !cancelled()
          && needs.matrix.result == 'success'
          && needs.build.result != 'skipped'
          && needs.matrix.outputs.publish == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout image list
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/images.json
          sparse-checkout-cone-mode: false

      - name: Download build metadata
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          pattern: meta-*
          path: meta
          merge-multiple: true

      - name: Prepare release body
        id: body
        uses: actions/github-script@v8
        env:
          ATTEMPTED: ${{ needs.matrix.outputs.distros }}
          STORE: ${{ needs.matrix.outputs.store }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL || 'https://pub-561df4012f1a46fbbdf618d5cc5941f6.r2.dev' }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Nothing built (every distro failed): leave the release as it is.
            if (!fs.existsSync('meta/kver')) {
              core.notice('No image was built in this run; release left unchanged.');
              core.setOutput('skip', 'true');
              return;
            }

            const kver = fs.readFileSync('meta/kver', 'utf8').trim();
            const psha = fs.readFileSync('meta/psha', 'utf8').trim();
            const ts   = fs.readFileSync('meta/ts',   'utf8').trim();

            // Distros this run tried to build
            const attempted = JSON.parse(process.env.ATTEMPTED || '[]');

            // Collect new checksums from this run
            const newSums = {};
            for (const f of fs.readdirSync('meta').filter(f => f.endsWith('.sha256'))) {
              const distro = f.replace('.sha256', '');
              newSums[distro] = fs.readFileSync(path.join('meta', f), 'utf8').trim();
            }

            // All known distros and their display names (order = table order)
            const onGitHub = process.env.STORE === 'github';
            const R2 = onGitHub
              ? `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/latest`
              : process.env.R2_PUBLIC_URL;
            const ALL_DISTROS = JSON.parse(fs.readFileSync('.github/images.json', 'utf8'))
              .map(d => ({ ...d, file: `ps5-${d.key}.img.xz` }));

            // On GitHub, images over 2 GiB are uploaded as .part1, .part2, ...
            const parts = {};
            if (onGitHub) {
              const { data: rel } = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag: 'latest',
              });
              const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
                ...context.repo, release_id: rel.id, per_page: 100,
              });
              for (const a of assets) {
                const m = a.name.match(/^(ps5-.+\.img\.xz)\.part(\d+)$/);
                if (m) (parts[m[1]] ||= []).push([Number(m[2]), a.name]);
              }
              for (const k in parts) parts[k] = parts[k].sort((x, y) => x[0] - y[0]).map(p => p[1]);
            }
            const download = d => parts[d.file]
              ? parts[d.file].map((p, i) => `[part ${i + 1}](${R2}/${p})`).join(' · ')
              : `[\`${d.file}\`](${R2}/${d.file})`;

            // Fetch existing release body to preserve distros not built this run
            const existingSums = {};
            try {
              const { data: rel } = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag: 'latest',
              });
              // Extract existing checksum lines (format: "hash  filename")
              const sumBlock = (rel.body || '').match(/```\n([\s\S]*?)```/);
              if (sumBlock) {
                for (const line of sumBlock[1].trim().split('\n')) {
                  const m = line.match(/^(\w+)\s+ps5-(\S+)\.img\.xz$/);
                  if (m) existingSums[m[2]] = line.trim();
                }
              }
              // Also preserve distros that appear in the table even without checksums
              for (const d of ALL_DISTROS) {
                if (rel.body && rel.body.includes(d.file) && !existingSums[d.key]) {
                  existingSums[d.key] = '';
                }
              }
            } catch (e) {
              core.info('No existing release found, starting fresh');
            }

            // An image not built in this run can still be newer than the
            // release body: a cancelled run uploads the images it finished
            // and never gets here. The .sha256 file next to each image on R2
            // is uploaded with it, so it is the one to trust.
            for (const d of ALL_DISTROS) {
              if (d.key in newSums) continue;
              try {
                const res = await fetch(`${R2}/${d.file}.sha256`, {
                  signal: AbortSignal.timeout(20000),
                });
                if (!res.ok) continue;
                const line = (await res.text()).trim();
                const [sum, name, ...rest] = line.split(/\s+/);
                if (!/^[0-9a-f]{64}$/.test(sum) || name !== d.file || rest.length) continue;
                if (existingSums[d.key] !== line) core.info(`${d.key}: checksum taken from R2`);
                existingSums[d.key] = line;
              } catch (e) {
                core.info(`${d.key}: no checksum file read from R2 (${e.message})`);
              }
            }

            // Merge: new checksums override existing ones
            const mergedSums = { ...existingSums };
            for (const [k, v] of Object.entries(newSums)) {
              mergedSums[k] = v;
            }

            // Build the table — only include distros that have been built at least once.
            // Each image has a .sha256 file next to it on R2, uploaded with the image.
            const rows = ALL_DISTROS
              .filter(d => d.key in mergedSums || d.key in newSums)
              .map(d => `| ${d.label} | ${download(d)} | [\`sha256\`](${R2}/${d.file}.sha256) |`);

            // Distros this run tried to build but did not (their previous image is kept)
            const failed = attempted.filter(d => !(d in newSums));
            const label = k => (ALL_DISTROS.find(d => d.key === k) || { label: k }).label;

            // Combine all checksum lines
            const allSumLines = ALL_DISTROS
              .filter(d => mergedSums[d.key])
              .map(d => mergedSums[d.key])
              .join('\n');

            const body = [
              'PS5 Linux images — built from latest `main`.',
              '',
              `Kernel: \`${kver}\``,
              `Patches: [\`${psha}\`](https://github.com/ps5-linux/ps5-linux-patches/commit/${psha})`,
              `Built: \`${ts}\``,
              ...(failed.length
                ? ['', `Not rebuilt in this run (previous image kept): ${failed.map(label).join(', ')}`]
                : []),
              '',
              '| Image | Download | Checksum |',
              '|-------|----------|----------|',
              ...rows,
              '',
              ...(Object.keys(parts).length
                ? ['Images in parts: download every part and join them before flashing, e.g.',
                   '`cat ps5-bazzite.img.xz.part* > ps5-bazzite.img.xz` (Windows: `copy /b ps5-bazzite.img.xz.part1 + ps5-bazzite.img.xz.part2 ps5-bazzite.img.xz`).',
                   '']
                : []),
              '**SHA256 checksums** (each image also has a `.sha256` file next to it):',
              '```',
              allSumLines,
              '```',
            ].join('\n');

            core.setOutput('text', body);

      - name: Move latest tag to current commit
        if: steps.body.outputs.skip != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const ref = 'tags/latest';
            try {
              await github.rest.git.updateRef({
                ...context.repo, ref, sha: context.sha, force: true,
              });
            } catch (e) {
              if (e.status !== 422) throw e;
              await github.rest.git.createRef({
                ...context.repo, ref: 'refs/tags/latest', sha: context.sha,
              });
            }

      - name: Create or update release
        if: steps.body.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: latest
          name: PS5 Linux Image (latest)
          body: ${{ steps.body.outputs.text }}
          make_latest: true

      - name: Refresh release publish date
        if: steps.body.outputs.skip != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              ...context.repo, tag: 'latest',
            });
            // Toggling draft off->on->off re-publishes, resetting published_at
            // to now while keeping the same release (reactions/comments survive).
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: rel.id, draft: true,
            });
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: rel.id, draft: false, make_latest: 'true',
            });
            core.info(`re-published release ${rel.id}`);
